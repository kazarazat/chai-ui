name: Feature request
description: Suggest a component, option or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?

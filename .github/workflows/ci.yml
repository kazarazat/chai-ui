name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to exact commits (version in the comment).
permissions:
  contents: read

jobs:
  test:
    name: Test (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18", "19"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Switch to React 19
        if: matrix.react == '19'
        run: pnpm --filter @chai-ui/react add -D react@19 react-dom@19 @types/react@19 @types/react-dom@19
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Install Chromium for the browser tests
        run: pnpm --filter @chai-ui/react exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Coverage
        if: matrix.react == '18'
        run: pnpm --filter @chai-ui/core --filter @chai-ui/react --filter @chai-ui/vue run test:coverage
      - name: Upload coverage to Codecov
        if: matrix.react == '18'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/coverage/lcov.info,packages/react/coverage/unit/lcov.info,packages/react/coverage/browser/lcov.info,packages/vue/coverage/unit/lcov.info,packages/vue/coverage/browser/lcov.info
          fail_ci_if_error: false

  pack-test:
    name: Packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack-test

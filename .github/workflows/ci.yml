name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to exact commits (version in the comment).
permissions:
  contents: read

jobs:
  test:
    name: Test (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18", "19"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Switch to React 19
        if: matrix.react == '19'
        run: pnpm --filter @chai-ui/react add -D react@19 react-dom@19 @types/react@19 @types/react-dom@19
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Install Chromium for the browser tests
        run: pnpm --filter @chai-ui/react exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Coverage
        if: matrix.react == '18'
        run: pnpm --filter @chai-ui/core --filter @chai-ui/react run test:coverage
      - name: Upload coverage to Codecov
        if: matrix.react == '18'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/coverage/lcov.info,packages/react/coverage/unit/lcov.info,packages/react/coverage/browser/lcov.info
          fail_ci_if_error: false

  pack-test:
    name: Packaging smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack-test

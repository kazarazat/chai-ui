name: Release

# On main, Changesets keeps a "Version Packages" pull request up to date.
# Merging it publishes to npm with trusted publishing (OIDC): no npm token
# is stored, and each package gets a provenance statement.
# Every push to main: with pending changesets, opens or updates the
# "Version Packages" PR; merging that PR publishes. With none pending, it
# publishes only versions missing from npm (usually nothing). The manual
# trigger stays for re-running a release.
#
# Actions are pinned to exact commits (version in the comment), so a moved
# or hijacked tag can't change what runs with publish rights.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the browser tests
        run: pnpm --filter @chai-ui/react exec playwright install --with-deps chromium
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: Version Packages
          commit-message: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      # `changeset publish` tags each released package here, but the action
      # only pushes tags when it recognizes the publish output, which the
      # current Changesets CLI no longer matches. Push them explicitly; with
      # nothing published there are no new tags and this does nothing.
      - name: Push release tags
        run: git push origin --tags
